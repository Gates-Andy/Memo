<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

<section layout:fragment="contents" class="contents d-flex justify-content-center">

    <div class="memo-box my-5">

        <h1 class="text-center">메모 입력</h1>

        <input type="text" class="form-control mb-2" placeholder="제목을 입력하세요" th:value="${memo.title}" />

        <textarea class="form-control mb-2" rows="10" placeholder="내용을 입력하세요" th:text="${memo.contents}">내용</textarea>

        <img th:if="${memo.imagePath != null}" th:src="@{${memo.imagePath}}" alt="이미지" style="max-width: 100%; margin-bottom: 10px;" />

        <input type="file" name="file" />

        <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-danger mt-3">삭제</button>

            <div>
                <a href="/post/list-view" class="btn btn-secondary mt-3">목록으로</a>
                <button type="button" class="btn btn-secondary mt-3">수정</button>
            </div>
        </div>

    </div>
</section>

</html>
