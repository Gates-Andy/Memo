<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layouts/default}">
	
	<section layout:fragment="contents" class="d-flex justify-content-center">
		<h1>메모 리스트</h1>
		<div class="memo-box my-5">
			<table class="text-center">
				<thead>
					<tr>
						<td>No.</td>
						<td>제목</td>
						<td>작성시간</td>
					</tr>
				</thead>
				<tbody>
					<tr th:each="memo:${memo.List}">
						<td th:text="${memo.id}">아이디</td>
						<td th:text="${memo.title}">내용</td>
						<td th:text="${#temporals.format(memo.createdAt,'yyyy-MM-dd HH:mm:ss')}">2025-07-01 10:00:00</td>
					</tr>
					
				</tbody>
			</table>
		</div>
	</section>
	
</html>
