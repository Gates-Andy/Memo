<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/default}">

<section layout:fragment="contents"
	class="contents d-flex justify-content-center">
	<div class="memo-box my-5">
		<h1 class="text-center">메모 입력</h1>
		<input type="text" class="form-control mb-2" id="titleInput"
			placeholder="제목을 입력하세요">
		<textarea class="form-control mb-2" rows="10" id="contentsInput"
			placeholder="내용을 입력하세요"></textarea>
		<input type="file">
		<div class="d-flex justify-content-between">
			<a href="/post/list-view" class="btn btn-secondary mt-3">목록으로</a>
			<button type="button" class="btn btn-secondary" id="saveBtn">저장</button>

		</div>

	</div>
</section>
<script layout:fragment="script">
	$("#saveBtn").on("click", function() {
		let title = $("#titleInput").val();
		let contents = $("#contentsInput").val();

		if (title == "") {
			alert("제목을 입력하세요");
			return;
		}

		if (contents == "") {
			alert("내용을 입력하세요");
			return;
		}

		$.ajax({
			type : "post",
			url : "/post/create",
			data : {
				"title" : title,
				"contents" : contents
			},
			success : function(response) {
				if (response.result == "success") {
					location.href = "/post/list-view";
				} else {
					alert("글 작성 실패");
				}
			},
			error : function() {
				alert("글 작성 에러");
			}
		})
	});
</script>
</html>
